# User-space NFSv4 server (nfs-ganesha, VFS backend): no host nfsd or kernel server module needed.
NFS_CORE_PARAM {
    NFS_Protocols = 4;
    Enable_NLM = false;
    Enable_RQUOTA = false;
    Enable_UDP = false;
    Bind_addr = 0.0.0.0;
}
NFSV4 {
    Grace_Period = 5;
    Lease_Lifetime = 60;
}
EXPORT {
    Export_Id = 1;
    Path = /export;
    Pseudo = /export;
    Access_Type = RW;
    Squash = No_Root_Squash;
    Protocols = 4;
    Transports = TCP;
    Delegations = None;
    SecType = sys;
    FSAL { Name = VFS; }
}
LOG {
    Default_Log_Level = EVENT;
}
